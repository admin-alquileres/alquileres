// PRESENCIA
function iniciarPresencia(user){/* Realtime Database no configurado aún */}
function renderPresencia(){if(!S.presencia.length)return '<div class="synbar"><div class="syd '+(S.synced?"":"off")+'"></div>'+(S.synced?"Sincronizado":"Conectando...")+'</div>';return '<div class="pbar"><div style="font-size:10px;color:var(--g4);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">En línea</div><div class="plist">'+S.presencia.map(function(u){return '<div class="pi"><div class="pd"></div>'+u.nombre+'</div>'}).join("")+'</div></div>';}

// AUTH
onAuthStateChanged(auth,function(user){if(user){S.usuario=user;iniciarPresencia(user);cargarTodo();}else{S.usuario=null;S.loading=false;S.presencia=[];renderLogin();}});
window.doLogin=async function(){var email=$("l-email").value.trim(),pass=$("l-pass").value,btn=$("l-btn"),err=$("l-err");if(!email||!pass){err.textContent="Completá usuario y contraseña";err.style.display="block";return;}btn.disabled=true;btn.textContent="Ingresando...";err.style.display="none";try{await signInWithEmailAndPassword(auth,email,pass);}catch(e){err.textContent="Usuario o contraseña incorrectos";err.style.display="block";btn.disabled=false;btn.textContent="Ingresar";}};
window.doLogout=async function(){await signOut(auth);S.sec="dashboard";S.propietarios=[];S.propiedades=[];S.contratos=[];S.pagos=[];S.inquilinos=[];S.synced=false;S.presencia=[];};

// FIREBASE CRUD
async function fbAdd(col,data){try{var r=await addDoc(collection(db,col),Object.assign({},data,{_ts:Date.now()}));toast("Guardado ✓");return r.id;}catch(e){toast("Error: "+e.message,false);return null;}}
async function fbUpd(col,id,data){try{await updateDoc(doc(db,col,id),Object.assign({},data,{_ts:Date.now()}));toast("Actualizado ✓");}catch(e){toast("Error: "+e.message,false);}}

async function cargarTodo(){S.loading=true;render();try{var cols=["propietarios","propiedades","contratos","pagos","inquilinos"];for(var i=0;i<cols.length;i++){var snap=await getDocs(collection(db,cols[i]));S[cols[i]]=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id})});}var meses=[...new Set(S.pagos.map(function(p){return p.mes}))].sort().reverse();S.liqMes=meses[0]||mesActual();S.synced=true;}catch(e){toast("Error: "+e.message,false);}S.loading=false;render();}

function numLetras(n){n=Math.round(n);var u=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];var d=["","diez","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];var c=["","cien","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];function m1k(n){if(n===0)return"";if(n===100)return"cien";if(n<20)return u[n];if(n<100){var dd=Math.floor(n/10),uu=n%10;return d[dd]+(uu?" y "+u[uu]:"");}var cc=Math.floor(n/100),r=n%100;var b=c[cc];if(cc===1&&r>0)b="ciento";return b+(r?" "+m1k(r):"");}if(n===0)return"cero";if(n>=1000000){var mm=Math.floor(n/1000000),r=n%1000000;return(mm===1?"un millón":m1k(mm)+" millones")+(r?" "+m1k(r):"");}if(n>=1000){var mm=Math.floor(n/1000),r=n%1000;return(mm===1?"mil":m1k(mm)+" mil")+(r?" "+m1k(r):"");}return m1k(n);}
function nroRec(){return String(Math.floor(10000000+Math.random()*90000000)).padStart(8,"0");}
function membreteRecibo(doc,nro){
  doc.setFillColor(255,255,255);doc.rect(0,0,210,297,"F");
  // "RECIBO" encima del recuadro
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(20,20,20);
  doc.text("RECIBO",12,10);
  // X grande en recuadro — tipo de comprobante
  doc.setDrawColor(20,20,20);doc.setLineWidth(0.8);
  doc.rect(12,13,18,18);
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(20,20,20);
  doc.text("X",21,26,{align:"center"});
  // Derecha
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(80,80,80);
  doc.text("DOCUMENTO NO VÁLIDO COMO FACTURA",198,12,{align:"right"});
  doc.setFontSize(8.5);doc.setFont("helvetica","bold");doc.setTextColor(40,40,40);
  doc.text("N° "+nro,198,20,{align:"right"});
  // Línea separadora
  doc.setDrawColor(180,180,180);doc.setLineWidth(0.3);doc.line(12,35,198,35);
  return 41;
}
function membreteLiquidacion(doc,nro){
  doc.setFillColor(255,255,255);doc.rect(0,0,210,297,"F");
  // "LIQUIDACIÓN" grande
  doc.setFont("helvetica","bold");doc.setFontSize(26);doc.setTextColor(20,20,20);
  doc.text("LIQUIDACIÓN",12,22);
  // Derecha
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(80,80,80);
  doc.text("DOCUMENTO NO VÁLIDO COMO FACTURA",198,12,{align:"right"});
  doc.setFontSize(8);doc.setTextColor(40,40,40);
  doc.text("N° "+nro,198,19,{align:"right"});
  doc.setDrawColor(180,180,180);doc.setLineWidth(0.3);doc.line(12,30,198,30);
  return 36;
}
function membrete(doc,nro){return membreteRecibo(doc,nro);}

window.aplicarIPCGrupo=async function(freq){
  var pctInput=document.getElementById("ipc-pct-"+freq);
  if(!pctInput||!pctInput.value)return toast("Ingresá el % para contratos de "+freq+" meses",false);
  var pct=parseFloat(pctInput.value);
  if(isNaN(pct)||pct<=0)return toast("El porcentaje debe ser mayor a 0",false);
  var activos=S.contratos.filter(function(c){return c.estado==="activo"&&+(c.frecActualizacion||6)===freq});
  var pendientes=[];
  activos.forEach(function(c){
    var prox=getProxActualizacion(c);if(!prox)return;
    var du=Math.round((prox-new Date())/86400000);
    if(du<45)pendientes.push(c);
  });
  if(!pendientes.length)return toast("No hay contratos de "+freq+" meses para actualizar",false);
  if(!confirm("¿Aplicar "+pct+"% a "+pendientes.length+" contrato(s) de cada "+freq+" meses?"))return;
  var promises=[];
  pendientes.forEach(function(c){
    var nuevo=Math.round(c.alquilerBase*(1+(pct/100)));
    promises.push(fbUpd("contratos",c._id,{alquilerBase:nuevo,ultimaActualizacion:hoy(),pctUltimaActualizacion:pct}).then(function(){
      S.contratos=S.contratos.map(function(x){return x._id===c._id?Object.assign({},x,{alquilerBase:nuevo,ultimaActualizacion:hoy(),pctUltimaActualizacion:pct}):x});
    }));
  });
  await Promise.all(promises);
  toast(promises.length+" alquiler(es) de "+freq+"m actualizado(s) +"+pct+"% ✓");
  render();
};

var S_HISTORIAL={};// {nombreInquilino: [entradas]}

async function cargarHistorialInquilino(nombre){
  if(S_HISTORIAL[nombre])return;
  try{
    var snap=await getDocs(collection(db,"historial"));
    var entradas=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id})})
      .filter(function(e){return e.inquilino===nombre})
      .sort(function(a,b){return(b.fecha||"").localeCompare(a.fecha||"")});
    S_HISTORIAL[nombre]=entradas;
  }catch(e){S_HISTORIAL[nombre]=[];}
}

window.agregarHistorial=async function(){
  var elFecha=document.getElementById("hist-fecha");
  var elObs=document.getElementById("hist-obs");
  var elNombre=document.getElementById("hist-nombre");
  if(!elFecha||!elObs||!elNombre)return;
  var fecha=elFecha.value;
  var obs=elObs.value.trim();
  var nombre=elNombre.value;
  if(!obs)return toast("Escribí una observación",false);
  if(!fecha)return toast("Ingresá la fecha",false);
  var data={inquilino:nombre,fecha:fecha,observacion:obs,creadoEn:Date.now()};
  var id=await fbAdd("historial",data);
  if(id){
    if(!S_HISTORIAL[nombre])S_HISTORIAL[nombre]=[];
    S_HISTORIAL[nombre].unshift(Object.assign({},data,{_id:id}));
    elObs.value="";
    elFecha.value=hoy();
    renderHistorialInline(nombre);
    toast("Registrado ✓");
  }
};

window.eliminarHistorial=async function(id,nombre){
  if(!confirm("¿Eliminar esta entrada?"))return;
  try{
    await updateDoc(doc(db,"historial",id),{_eliminado:true});
  }catch(e){}
  if(S_HISTORIAL[nombre]){
    S_HISTORIAL[nombre]=S_HISTORIAL[nombre].filter(function(e){return e._id!==id});
  }
  renderHistorialInline(nombre);
};

// Calcular estado del depósito de un contrato
function estadoDeposito(c){
  var dep=c.deposito||{};
  var montoTotal=c.alquilerBase||0; // siempre = 1 mes de alquiler
  var pagado=dep.pagado||0;
  var diferencia=montoTotal-pagado;
  var cuotas=dep.cuotas||1;
  var cuotasPagadas=dep.cuotasPagadas||0;
  return{
    montoTotal:montoTotal,
    pagado:pagado,
    diferencia:diferencia,
    completo:diferencia<=0,
    cuotas:cuotas,
    cuotasPagadas:cuotasPagadas,
    pendienteCuota:cuotas>1&&cuotasPagadas<cuotas,
    diferenciaPendiente:dep.diferenciaPendiente||0
  };
}

// Calcular estado de honorarios de un contrato
function estadoHonorarios(c){
  var hon=c.honorarios||{};
  var base=c.alquilerBase||0;
  var montoTotal=hon.montoTotal||(hon.tipo==="mes"?base:Math.round(base/2));
  var pagado=hon.pagado||0;
  var cuotas=hon.cuotas||1;
  var cuotasPagadas=hon.cuotasPagadas||0;
  return{
    montoTotal:montoTotal,
    pagado:pagado,
    completo:pagado>=montoTotal,
    cuotas:cuotas,
    cuotasPagadas:cuotasPagadas,
    pendienteCuota:cuotas>1&&cuotasPagadas<cuotas
  };
}

// Registrar pago de depósito (cuota)
window.pagarCuotaDeposito=async function(cid){
  var c=S.contratos.find(function(x){return x._id===cid});
  if(!c)return;
  var dep=c.deposito||{};
  var montoTotal=c.alquilerBase||0;
  var cuotas=dep.cuotas||1;
  var cuotasPagadas=dep.cuotasPagadas||0;
  var montoCuota=dep.diferenciaPendiente>0?dep.diferenciaPendiente:Math.round(montoTotal/cuotas);
  var nuevasPagadas=cuotasPagadas+1;
  var nuevoPagado=(dep.pagado||0)+montoCuota;
  var update={
    deposito:{
      cuotas:cuotas,
      cuotasPagadas:nuevasPagadas,
      pagado:nuevoPagado,
      diferenciaPendiente:0
    }
  };
  await fbUpd("contratos",cid,update);
  S.contratos=S.contratos.map(function(x){return x._id===cid?Object.assign({},x,update):x});
  toast("Cuota de depósito registrada ✓");render();
};

// Registrar pago de honorarios (cuota)
window.pagarCuotaHonorarios=async function(cid){
  var c=S.contratos.find(function(x){return x._id===cid});
  if(!c)return;
  var hon=c.honorarios||{};
  var montoTotal=hon.montoTotal||Math.round((c.alquilerBase||0)/2);
  var cuotas=hon.cuotas||1;
  var cuotasPagadas=hon.cuotasPagadas||0;
  var montoCuota=Math.round(montoTotal/cuotas);
  var nuevasPagadas=cuotasPagadas+1;
  var nuevoPagado=(hon.pagado||0)+montoCuota;
  var update={
    honorarios:{
      tipo:hon.tipo||"medio",
      montoTotal:montoTotal,
      cuotas:cuotas,
      cuotasPagadas:nuevasPagadas,
      pagado:nuevoPagado
    }
  };
  await fbUpd("contratos",cid,update);
  S.contratos=S.contratos.map(function(x){return x._id===cid?Object.assign({},x,update):x});
  // Registrar en caja
  await fbAdd("caja",{
    tipo:"honorario",
    fecha:hoy(),
    monto:montoCuota,
    concepto:"Honorarios "+( c.inquilino||"")+" cuota "+nuevasPagadas+"/"+cuotas,
    inquilino:c.inquilino||"",
    cuotas:cuotas,
    cuotaNum:nuevasPagadas,
    contratoId:cid
  });
  toast("Honorarios registrados en caja ✓");render();
};

// Items automáticos pendientes para el cobro del mes
function itemsPendientesContrato(c){
  var items=[];
  // Depósito pendiente
  var dep=estadoDeposito(c);
  if(dep.pendienteCuota){
    var montoCuota=Math.round(dep.montoTotal/dep.cuotas);
    items.push({tipo:"variable",desc:"Depósito cuota "+(dep.cuotasPagadas+1)+"/"+dep.cuotas,monto:montoCuota,_esDep:true,_cid:c._id});
  }
  if(dep.diferenciaPendiente>0){
    items.push({tipo:"variable",desc:"Diferencia depósito (actualiz. IPC)",monto:dep.diferenciaPendiente,_esDep:true,_cid:c._id});
  }
  // Honorarios pendientes
  var hon=estadoHonorarios(c);
  if(hon.pendienteCuota){
    var montoCuotaH=Math.round(hon.montoTotal/hon.cuotas);
    items.push({tipo:"variable",desc:"Honorarios cuota "+(hon.cuotasPagadas+1)+"/"+hon.cuotas,monto:montoCuotaH,_esHon:true,_cid:c._id});
  }
  return items;
}

window.abrirFichaInquilino=function(nombre){
  // Reconstruir el objeto inquilino desde el estado
  var todos={};
  S.contratos.forEach(function(c){
    if(!c.inquilino)return;
    if(!todos[c.inquilino])todos[c.inquilino]={nombre:c.inquilino,dni:c.dni||"",telefono:c.telefono||"",email:c.email||"",garante:c.garante||"",contratos:[]};
    todos[c.inquilino].contratos.push(c);
    if(c.telefono&&!todos[c.inquilino].telefono)todos[c.inquilino].telefono=c.telefono;
    if(c.email&&!todos[c.inquilino].email)todos[c.inquilino].email=c.email;
    if(c.dni&&!todos[c.inquilino].dni)todos[c.inquilino].dni=c.dni;
  });
  S.inquilinos.forEach(function(i){
    if(!todos[i.nombre])todos[i.nombre]={nombre:i.nombre,dni:i.dni||"",telefono:i.telefono||"",email:i.email||"",garante:"",contratos:[]};
    else{if(i.telefono)todos[i.nombre].telefono=i.telefono;if(i.email)todos[i.nombre].email=i.email;if(i.dni)todos[i.nombre].dni=i.dni;}
  });
  S.inquilinoActivo=todos[nombre]||{nombre:nombre,contratos:[]};
  render();
};

function renderLiquidaciones(){
  var meses=[...new Set(S.pagos.map(function(p){return p.mes}))].sort().reverse();
  var mes=S.liqMes||meses[0]||mesActual();
  var pagosMes=S.pagos.filter(function(p){return p.mes===mes&&p.estado==="cobrado"});
  var porProp={};pagosMes.forEach(function(p){var n=p.propietarioNombre||"Sin propietario";if(!porProp[n])porProp[n]=[];porProp[n].push(p);});
  var cards=Object.entries(porProp).map(function(entry){
    var nombre=entry[0],pagos=entry[1];
    var totAlq=pagos.reduce(function(s,p){return s+(p.alquiler||p.monto||0)},0);
    var totCom=pagos.reduce(function(s,p){return s+(p.comision||Math.round((p.alquiler||p.monto||0)*(p.comisionAgencia||5)/100))},0);
    var totNeto=totAlq-totCom;
    var rows=pagos.map(function(p){var alq=p.alquiler||p.monto||0;var com=p.comision||Math.round(alq*(p.comisionAgencia||5)/100);var neto=alq-com;return '<div class="lr"><span class="tm">'+(p.inquilino||"")+'</span><span class="ts">'+(p.direccion||"")+'</span></div><div class="lr"><span style="padding-left:12px">Alquiler: '+moneda(alq)+'</span><span class="lr-r">Com. -'+moneda(com)+'</span><span class="lr-g">Neto: '+moneda(neto)+'</span></div>'}).join("");
    return '<div class="lcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><div style="font-size:14px;font-weight:600">'+nombre+'</div><div style="font-size:11px;color:var(--g3);margin-top:2px">'+pagos.length+' propiedad(es) · '+mesNombre(mes)+'</div></div><button class="btn sm" onclick="window.pdfPropietario(&#39;'+pagos[0]._id+'&#39;)">📄 PDF</button></div>'+rows+'<div class="lr tot"><span>Total a transferir</span><span class="lr-g">'+moneda(totNeto)+'</span></div></div>';
  }).join("");

function renderIPC(){
  var activos=S.contratos.filter(function(c){return c.estado==="activo"});
  var frecuencias=[3,4,6,12];
  var gruposPorFrec={};
  frecuencias.forEach(function(fr){gruposPorFrec[fr]={pendientes:[],proximos:[]};});
  activos.forEach(function(c){
    var fr=+(c.frecActualizacion||6);
    if(!gruposPorFrec[fr])gruposPorFrec[fr]={pendientes:[],proximos:[]};
    var prox=getProxActualizacion(c);if(!prox)return;
    var du=Math.round((prox-new Date())/86400000);
    if(du<0)gruposPorFrec[fr].pendientes.push({c:c,dias:Math.abs(du)});
    else if(du<=45)gruposPorFrec[fr].proximos.push({c:c,dias:du});
  });
  var totalPend=0;var totalProx=0;
  frecuencias.forEach(function(fr){totalPend+=gruposPorFrec[fr].pendientes.length;totalProx+=gruposPorFrec[fr].proximos.length;});
  var recientes=S.contratos.filter(function(c){return c.pctUltimaActualizacion&&c.ultimaActualizacion}).sort(function(a,b){return(b.ultimaActualizacion||"").localeCompare(a.ultimaActualizacion||"")}).slice(0,15);
  var kpis='<div class="kg" style="grid-template-columns:repeat(3,1fr)"><div class="kc" style="border-top-color:var(--ro)"><div class="kl">Pendientes</div><div class="kv">'+totalPend+'</div><div class="ks">actualizaciones vencidas</div></div><div class="kc" style="border-top-color:var(--am)"><div class="kl">Próximas 45 días</div><div class="kv">'+totalProx+'</div><div class="ks">a actualizar pronto</div></div><div class="kc" style="border-top-color:var(--ve)"><div class="kl">Total activos</div><div class="kv">'+activos.length+'</div><div class="ks">contratos</div></div></div>';

  // Configurador de frecuencias
  var sinFrec=activos.filter(function(c){return +(c.frecActualizacion||6)===6});
  var configHtml="";
  if(sinFrec.length){
    var configRows=activos.map(function(c){
      var fr=+(c.frecActualizacion||6);
      return '<tr><td class="tm">'+(c.inquilino||"")+'</td><td>'+(c.direccion||"")+'</td><td>'+(c.propietarioNombre||"")+'</td><td>'+moneda(c.alquilerBase)+'</td><td><select class="inp freq-sel" data-cid="'+c._id+'" style="width:90px"><option value="3"'+(fr===3?" selected":"")+'>3 meses</option><option value="4"'+(fr===4?" selected":"")+'>4 meses</option><option value="6"'+(fr===6?" selected":"")+'>6 meses</option><option value="12"'+(fr===12?" selected":"")+'>12 meses</option></select></td></tr>';
    }).join("");
    configHtml='<div class="lcard" style="border-left:3px solid var(--ce);margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-size:15px;font-weight:700">⚙️ Configurar frecuencia de actualización</div><div style="font-size:11px;color:var(--g3);margin-top:3px">Asigná cada 3 o 4 meses a cada contrato. Después hacé clic en Guardar.</div></div><button class="btn na" onclick="window.guardarFrecuencias()">💾 Guardar frecuencias</button></div><div class="tw"><table><thead><tr><th>Inquilino</th><th>Propiedad</th><th>Propietario</th><th>Alquiler</th><th>Frecuencia</th></tr></thead><tbody>'+configRows+'</tbody></table></div></div>';
  }

  // Grupos por frecuencia
  var gruposHtml=frecuencias.map(function(fr){
    var grupo=gruposPorFrec[fr];
    var todos=grupo.pendientes.concat(grupo.proximos);
    if(!todos.length)return"";
    var cards=todos.map(function(item){
      var c=item.c;var esPend=grupo.pendientes.indexOf(item)!==-1;
      return '<div class="ipc-card"><div class="ipc-info"><div class="ipc-name">'+(c.inquilino||"")+'</div><div class="ipc-dir">'+(c.direccion||"")+'</div><div class="ipc-det">Prop: '+(c.propietarioNombre||"")+" · "+(esPend?"Vencida hace "+item.dias+" días":"En "+item.dias+" días")+'</div></div><div class="ipc-cur">'+moneda(c.alquilerBase)+'</div></div>';
    }).join("");

var S_CAJA={tab:"todos",movimientos:[],cargado:false};

window.abrirModalCaja=function(tipo){
  S.modal="caja_nuevo";
  S.form={tipo:tipo||"gasto",fecha:hoy(),monto:"",concepto:"",detalle:"",inquilino:"",cuotas:1,cuotaNum:1};
  render();
};

window.guardarMovCaja=async function(){
  // Leer directamente del DOM para evitar problemas de sincronización
  var elConcepto=document.getElementById("caja-concepto");
  var elMonto=document.getElementById("caja-monto");
  var elFecha=document.getElementById("caja-fecha");
  var elDetalle=document.getElementById("caja-detalle");
  var elInquilino=document.getElementById("caja-inquilino");
  var elCuotas=document.getElementById("caja-cuotas");
  var elCuotaNum=document.getElementById("caja-cuotanum");
  var concepto=elConcepto?elConcepto.value.trim():(S.form.concepto||"");
  var monto=elMonto?+(elMonto.value||0):(+(S.form.monto||0));
  var fecha=elFecha?elFecha.value:(S.form.fecha||hoy());
  var detalle=elDetalle?elDetalle.value:(S.form.detalle||"");
  var inquilino=elInquilino?elInquilino.value:(S.form.inquilino||"");
  var cuotas=elCuotas?+elCuotas.value:(+(S.form.cuotas||1));
  var cuotaNum=elCuotaNum?+elCuotaNum.value:(+(S.form.cuotaNum||1));
  var f=S.form;
  if(!concepto||!monto)return toast("Completá concepto y monto",false);
  var data={tipo:f.tipo,fecha:fecha||hoy(),monto:monto,concepto:concepto,detalle:detalle,recuperado:false};
  if(f.tipo==="adelanto"){data.inquilino=inquilino;data.recuperado=false;}
  if(f.tipo==="honorario"){data.inquilino=inquilino;data.cuotas=cuotas;data.cuotaNum=cuotaNum;}
  var id=await fbAdd("caja",data);
  if(id){
    S_CAJA.movimientos.unshift(Object.assign({},data,{_id:id}));
    S.modal=null;render();
    toast("Registrado ✓");
  }
};

window.marcarRecuperado=async function(id){
  await fbUpd("caja",id,{recuperado:true,fechaRecuperado:hoy()});
  S_CAJA.movimientos=S_CAJA.movimientos.map(function(m){return m._id===id?Object.assign({},m,{recuperado:true,fechaRecuperado:hoy()}):m});
  toast("Marcado como recuperado ✓");render();
};

window.eliminarMovCaja=async function(id){
  if(!confirm("¿Eliminar este movimiento?"))return;
  try{
    var{doc:docRef,deleteDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    S_CAJA.movimientos=S_CAJA.movimientos.filter(function(m){return m._id!==id});
    toast("Eliminado ✓");render();
  }catch(e){
    S_CAJA.movimientos=S_CAJA.movimientos.filter(function(m){return m._id!==id});
    toast("Eliminado ✓");render();
  }
};

async function cargarCaja(){
  if(S_CAJA.cargado)return;
  try{
    var snap=await getDocs(collection(db,"caja"));
    S_CAJA.movimientos=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id})})
      .sort(function(a,b){return(b.fecha||"").localeCompare(a.fecha||"")});
    S_CAJA.cargado=true;
  }catch(e){toast("Error cargando caja: "+e.message,false);}
}

function renderCaja(){
  if(!S_CAJA.cargado){
    cargarCaja().then(function(){render();});
    return '<div class="load"><div class="sp"></div>Cargando caja...</div>';
  }
  var movs=S_CAJA.movimientos;
  var mesHoy=mesActual();

  // Comisiones automáticas del mes
  var comAuto=S.pagos.filter(function(p){return p.estado==="cobrado"&&p.mes===mesHoy})
    .reduce(function(s,p){return s+(p.comision||Math.round((p.alquiler||0)*(p.comisionAgencia||5)/100))},0);
  var comTotal=S.pagos.filter(function(p){return p.estado==="cobrado"})
    .reduce(function(s,p){return s+(p.comision||Math.round((p.alquiler||0)*(p.comisionAgencia||5)/100))},0);

  // Totales de movimientos manuales
  var ingresosMan=movs.filter(function(m){return m.tipo==="honorario"||m.tipo==="ingreso"}).reduce(function(s,m){return s+(m.monto||0)},0);
  var egresos=movs.filter(function(m){return m.tipo==="gasto"||m.tipo==="retiro"}).reduce(function(s,m){return s+(m.monto||0)},0);
  var adelantosPend=movs.filter(function(m){return m.tipo==="adelanto"&&!m.recuperado}).reduce(function(s,m){return s+(m.monto||0)},0);

    if(m.inquilino&&m.tipo==="honorario")extra+=' — '+m.inquilino;
    var acciones='<button class="btn sm" style="background:rgba(231,76,60,.15);color:#ff7b6b;padding:3px 7px;font-size:10px" onclick="window.eliminarMovCaja(&#39;'+m._id+'&#39;)">✕</button>';
    if(m.tipo==="adelanto"&&!m.recuperado)acciones='<button class="btn sm" style="background:rgba(39,174,96,.15);color:#5ddb8a;padding:3px 7px;font-size:10px;margin-right:4px" onclick="window.marcarRecuperado(&#39;'+m._id+'&#39;)">✓ Recuperado</button>'+acciones;
    return '<div class="mov-item '+tipoClass+'">'+
      '<div class="mov-info">'+

      '<div class="mov-fecha">'+(m.fecha||"")+'</div>'+
      acciones+
    '</div>';
  }).join("");

  var tabOpts=[
    {k:"todos",l:"Todos"},

    {k:"gasto",l:"Gastos"},
    {k:"retiro",l:"Retiros Matías"},
    {k:"adelanto",l:"Adelantos"},

    return '<button class="tab-btn'+(tab===t.k?" on":"")+'" onclick="S_CAJA.tab=\''+t.k+'\';render()">'+t.l+'</button>';
  }).join("");

  return '<div class="caja-grid">'+
    '<div class="caja-card saldo"><div class="caja-lbl">Saldo disponible</div><div class="caja-val" style="color:var(--ce)">'+moneda(saldo)+'</div><div class="caja-sub">Tiempo real · comisiones + honorarios − gastos</div></div>'+
    '<div class="caja-card"><div class="caja-lbl">Comisiones '+mesNombre(mesHoy)+'</div><div class="caja-val" style="color:#5ddb8a">'+moneda(comAuto)+'</div><div class="caja-sub">'+pctCom+'% del objetivo mensual ('+moneda(comMesObjetivo)+')</div></div>'+

// ── SETUP / PUESTA A PUNTO ────────────────────────────────────────────────────
window.setupMarcar=function(el){
  var id=el.dataset.id;var field=el.dataset.field;
  var val=field==="alquilerBase"||field==="frecActualizacion"||field==="depPagado"?+(el.value||0):el.value;
  if(!S.setupCambios[id])S.setupCambios[id]={};
  S.setupCambios[id][field]=val;
  el.classList.add("changed");
  document.getElementById("setup-n-cambios").textContent=Object.keys(S.setupCambios).length;
  document.getElementById("setup-btn-guardar").disabled=false;
};

window.setupMarcarDep=function(el){
  var id=el.dataset.id;
  var tieneDeposito=el.value==="si";
  if(!S.setupCambios[id])S.setupCambios[id]={};
  var c=S.contratos.find(function(x){return x._id===id});
  var alq=(S.setupCambios[id].alquilerBase)||(c&&c.alquilerBase)||0;
  S.setupCambios[id].deposito=tieneDeposito?{registrado:true,cuotas:1,cuotasPagadas:1,pagado:alq,completo:true,diferenciaPendiente:0}:{registrado:false,cuotas:1,cuotasPagadas:0,pagado:0,completo:false,diferenciaPendiente:0};
  el.classList.add("changed");
  document.getElementById("setup-n-cambios").textContent=Object.keys(S.setupCambios).length;
  document.getElementById("setup-btn-guardar").disabled=false;
  // Mostrar/ocultar campo de monto pagado
  var depRow=document.getElementById("dep-pagado-"+id);
  if(depRow)depRow.style.display=tieneDeposito?"block":"none";
};

window.setupMarcarDepPagado=function(el){
  var id=el.dataset.id;
  var c=S.contratos.find(function(x){return x._id===id});
  var alq=(S.setupCambios[id]&&S.setupCambios[id].alquilerBase)||(c&&c.alquilerBase)||0;
  var pagado=+(el.value||0);
  if(!S.setupCambios[id])S.setupCambios[id]={};
  if(!S.setupCambios[id].deposito)S.setupCambios[id].deposito={registrado:true};
  S.setupCambios[id].deposito.pagado=pagado;
  S.setupCambios[id].deposito.completo=pagado>=alq;
  S.setupCambios[id].deposito.diferenciaPendiente=Math.max(0,alq-pagado);
  el.classList.add("changed");
};

window.setupGuardar=async function(){
  var ids=Object.keys(S.setupCambios);
  if(!ids.length)return;
  if(!confirm("¿Guardar "+ids.length+" cambio(s)?"))return;
  var btn=document.getElementById("setup-btn-guardar");
  btn.disabled=true;btn.textContent="Guardando...";
  var ok=0;
  for(var i=0;i<ids.length;i++){
    var id=ids[i];
    var data=Object.assign({},S.setupCambios[id],{_ts:Date.now()});
    // Limpiar campos que no van directo al contrato
    delete data.depPagado;
    try{
      await fbUpd("contratos",id,data);
      S.contratos=S.contratos.map(function(x){return x._id===id?Object.assign({},x,data):x});
      ok++;
    }catch(e){toast("Error en "+id,false);}
  }
  S.setupCambios={};
  btn.textContent="💾 Guardar todo";
  toast("✅ "+ok+" contrato(s) actualizado(s)");
  render();
};

window.setupFiltrar=function(val){S.setupBuscar=val;renderParcial();};

function renderSetup(){
  var activos=S.contratos.filter(function(c){return c.estado==="activo"});
  var q=(S.setupBuscar||"").toLowerCase();
  var lista=q?activos.filter(function(c){return(c.inquilino||"").toLowerCase().includes(q)||(c.direccion||"").toLowerCase().includes(q)||(c.propietarioNombre||"").toLowerCase().includes(q)}):activos;
  var nCambios=Object.keys(S.setupCambios).length;

  // Stats
  var sinFecha=activos.filter(function(c){return !c.ultimaActualizacion}).length;
  var conDep=activos.filter(function(c){return c.deposito&&c.deposito.registrado}).length;
  var sinDep=activos.length-conDep;

  var rows=lista.map(function(c){
    var cam=S.setupCambios[c._id]||{};
    var alqVal=cam.alquilerBase!==undefined?cam.alquilerBase:(c.alquilerBase||"");
    var ultVal=cam.ultimaActualizacion!==undefined?cam.ultimaActualizacion:(c.ultimaActualizacion||"");
    var frVal=cam.frecActualizacion!==undefined?cam.frecActualizacion:(+(c.frecActualizacion||6));
    var dep=cam.deposito!==undefined?cam.deposito:(c.deposito||null);
    var tieneDeposito=dep&&dep.registrado;
    var depPagado=dep?(dep.pagado||0):0;
    var alqActual=+(alqVal||c.alquilerBase||0);
    var depCompleto=dep&&dep.completo;
    var mod=cam&&Object.keys(cam).length>0;
    return '<tr style="'+(mod?"background:rgba(245,166,35,.03)":"")+'">'+'<td><div style="font-weight:500;color:var(--bl);font-size:12px">'+(c.inquilino||"")+'</div><div style="font-size:10px;color:var(--g3)">'+(c.direccion||"")+'</div></td>'+
    '<td style="font-size:10px;color:var(--g3)">'+(c.propietarioNombre||"")+'</td>'+
    '<td><input type="number" data-id="'+c._id+'" data-field="alquilerBase" value="'+alqVal+'" placeholder="$" oninput="window.setupMarcar(this)" '+(mod&&cam.alquilerBase!==undefined?'class="changed"':"")+'>'+
    (c.alquilerBase?'<div style="font-size:10px;color:var(--g3);text-decoration:line-through;margin-top:2px">$'+Math.round(c.alquilerBase).toLocaleString("es-AR")+'</div>':"")+
    '</td>'+
    '<td><input type="date" data-id="'+c._id+'" data-field="ultimaActualizacion" value="'+ultVal+'" oninput="window.setupMarcar(this)" '+(mod&&cam.ultimaActualizacion!==undefined?'class="changed"':"")+'>'+
    (c.ultimaActualizacion?"":'<div style="font-size:10px;color:var(--ro)">Sin fecha</div>')+
    '</td>'+
    '<td><select data-id="'+c._id+'" data-field="frecActualizacion" onchange="window.setupMarcar(this)" '+(mod&&cam.frecActualizacion!==undefined?'class="changed"':"")+'>'+
    ['3','4','6','12'].map(function(v){return '<option value="'+v+'"'+(+frVal===+v?' selected':'')+'>c/'+v+'m</option>';}).join("")+
    '</select></td>'+
    '<td>'+
    '<select data-id="'+c._id+'" onchange="window.setupMarcarDep(this)" '+(mod&&cam.deposito!==undefined?'class="changed"':"")+'>'+
    '<option value="no"'+(tieneDeposito?'':' selected')+'>Sin depósito</option>'+
    '<option value="si"'+(tieneDeposito?' selected':'')+'>Con depósito</option>'+
    '</select>'+
    (tieneDeposito?'<div id="dep-pagado-'+c._id+'" style="margin-top:4px"><input type="number" data-id="'+c._id+'" value="'+depPagado+'" placeholder="$ pagado" oninput="window.setupMarcarDepPagado(this)"><div style="font-size:10px;margin-top:2px;color:'+(depCompleto?"var(--ve)":"var(--na)")+'">'+(depCompleto?"✓ Completo":"Faltan $"+Math.max(0,alqActual-depPagado).toLocaleString("es-AR"))+'</div></div>':'<div id="dep-pagado-'+c._id+'" style="display:none"></div>')+
    '</td>'+
    '<td style="text-align:center">'+(mod?'<span style="color:var(--na)">●</span>':'')+'</td>'+
    '</tr>';
  }).join("");

  return '<div class="kg" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">'+
    '<div class="kc" style="border-top-color:var(--ce)"><div class="kl">Contratos activos</div><div class="kv">'+activos.length+'</div></div>'+
    '<div class="kc" style="border-top-color:var(--ro)"><div class="kl">Sin fecha actualiz.</div><div class="kv">'+sinFecha+'</div><div class="ks">por completar</div></div>'+
    '<div class="kc" style="border-top-color:var(--ve)"><div class="kl">Con depósito</div><div class="kv">'+conDep+'</div></div>'+
    '<div class="kc" style="border-top-color:var(--am,#f39c12)"><div class="kl">Sin depósito registrado</div><div class="kv">'+sinDep+'</div></div>'+
  '</div>'+
  '<div class="filt" style="margin-bottom:12px">'+
    '<input class="inp" placeholder="Buscar inquilino, dirección, propietario..." style="min-width:280px" value="'+(S.setupBuscar||"")+'" id="buscador-setup" oninput="window.setupFiltrar(this.value)">'+
    '<span style="font-size:11px;color:var(--g3)">'+lista.length+' de '+activos.length+' contratos</span>'+
  '</div>'+
  '<div class="tw setup-table"><table><thead><tr>'+
    '<th>Inquilino / Dirección</th>'+
    '<th>Propietario</th>'+
    '<th style="width:120px">Alquiler real ($)</th>'+
    '<th style="width:120px">Última actualiz.</th>'+
    '<th style="width:80px">Frec.</th>'+
    '<th style="width:160px">Depósito</th>'+
    '<th style="width:30px"></th>'+
  '</tr></thead><tbody>'+(rows||'<tr><td colspan=7><div class="empty">Sin contratos</div></td></tr>')+'</tbody></table></div>'+
  '<div class="setup-bar">'+
    '<span style="font-size:12px;color:var(--g3)"><span id="setup-n-cambios">'+nCambios+'</span> cambio(s) sin guardar</span>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn" onclick="S.setupCambios={};render()" style="background:var(--n3);color:var(--g3)">Descartar</button>'+
      '<button id="setup-btn-guardar" class="btn na" onclick="window.setupGuardar()" '+(nCambios===0?"disabled":"")+'>💾 Guardar todo</button>'+
    '</div>'+
  '</div>';
}

var TITLES={dashboard:["Dashboard","Resumen general"],contratos:["Contratos","Clic en un contrato para registrar pagos"],cobranzas:["Cobranzas","Historial de cobros"],liquidaciones:["Liquidaciones","Liquidación mensual a propietarios"],ipc:["Actualizaciones IPC","Contratos pendientes de actualización"],inquilinos:["Inquilinos","Clic en un inquilino para ver su ficha"],propietarios:["Propietarios","Ficha y propiedades"],caja:["Caja agencia","Ingresos, gastos y saldo en tiempo real"],setup:["Puesta a punto","Actualización masiva de valores y depósitos"]};

function renderParcial(){
  // Renderiza solo el contenido principal sin tocar el DOM del header/sidebar
  // Así los inputs de búsqueda no pierden el foco
  var _ae=document.activeElement;
  var _fid=_ae&&_ae.id?_ae.id:null;
  var _fval=_ae?_ae.value:null;
  var _fstart=null,_fend=null;
  if(_ae&&_ae.tagName==="INPUT"){try{_fstart=_ae.selectionStart;_fend=_ae.selectionEnd;}catch(e){}}
  render();
  if(_fid){
    setTimeout(function(){
      var el=document.getElementById(_fid);
      if(el){
        el.focus();
        try{if(_fstart!==null)el.setSelectionRange(_fstart,_fend);}catch(e){}
      }
    },0);
  }
}
function render(){
  if(!S.usuario){renderLogin();return;}
  var _ae=document.activeElement;
  var _fid=_ae&&_ae.id?_ae.id:null;
  var _fstart=null,_fend=null;
  if(_fid&&_ae.tagName==="INPUT"){try{_fstart=_ae.selectionStart;_fend=_ae.selectionEnd;}catch(e){}}
  var sec=TITLES[S.sec];var pt=sec[0];var ps=sec[1];
  var body="";
  if(S.loading)body='<div class="load"><div class="sp"></div>Cargando datos...</div>';
  else if(S.sec==="dashboard")body=renderDashboard();
  else if(S.sec==="contratos")body=renderContratos();
  else if(S.sec==="cobranzas")body=renderCobranzas();
  else if(S.sec==="liquidaciones")body=renderLiquidaciones();
  else if(S.sec==="ipc")body=renderIPC();
  else if(S.sec==="inquilinos")body=renderInquilinos();
  else if(S.sec==="propietarios")body=renderPropietarios();else if(S.sec==="caja")body=renderCaja();else if(S.sec==="setup")body=renderSetup();
  var userLabel=(S.usuario.email||"").split("@")[0];
  var temaBtn=document.body.classList.contains("light")?"☀️":"🌙";
  $("root").innerHTML='<div class="app"><aside class="sb"><div class="slw"><div class="slr">'+logoSVG(30)+'<div><div class="sbr">ECKERDT <span>INMOBILIARIA</span></div></div></div><div class="sbs">Urdinarrain · Entre Ríos</div></div><ul class="nav">'+NAVS.map(function(n){return '<li class="'+(S.sec===n.id?"on":"")+'" onclick="window.go(&#39;'+n.id+'&#39;)"><span>'+n.ic+'</span>'+n.lbl+'</li>'}).join("")+'</ul><div class="nu"><div><div style="font-size:10px;color:var(--g4)">Usuario</div><strong>'+userLabel+'</strong></div><button class="nub" onclick="window.doLogout()">Salir</button></div><div id="presence-area">'+renderPresencia()+'</div><div class="sfoot">© 2025 Eckerdt Negocios Inmobiliarios</div></aside><main class="main"><div class="ph"><div class="phl"><div class="pha"></div><div><div class="pt">'+pt+'</div><div class="ps">'+ps+'</div></div></div><button onclick="window.toggleTema()" style="background:var(--n3);border:1px solid var(--n4);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--g3)">'+temaBtn+'</button></div>'+body+'</main></div>'+renderModal();
  // Restaurar foco al input activo después del re-render
  if(_fid){var _el=document.getElementById(_fid);if(_el){_el.focus();try{if(_fstart!==null)_el.setSelectionRange(_fstart,_fend);}catch(e){}}}
}

render();
cargarTodo();
